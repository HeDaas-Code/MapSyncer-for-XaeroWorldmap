plugins {
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

// 根项目：仅聚合 Minecraft 1.20.1 Forge 构建
subprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('buildAll') {
    description = '构建 Minecraft 1.20.1 Forge 版本'
    group = 'build'
    dependsOn ':mc-1.20.1:forge:build'
    finalizedBy 'collectJars'
}

tasks.register('collectJars', Copy) {
    description = '将 1.20.1 Forge JAR 收集到 output 目录'
    group = 'distribution'
    into layout.projectDirectory.dir('output')
    from(project(':mc-1.20.1:forge').layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-slim.jar', '*-sources.jar', '*-javadoc.jar'
    }
    outputs.upToDateWhen { false }
}

tasks.register('buildPackager') {
    description = '构建 MapPackager 并输出到 output 目录'
    group = 'distribution'
    dependsOn ':libs:core:mapPackagerDist'
    doLast {
        copy {
            from(rootProject.layout.projectDirectory.dir('libs/core/build/dist')) {
                include 'mapsyncer-packager-*.zip'
            }
            into layout.projectDirectory.dir('output')
        }
        logger.lifecycle('MapPackager 产物已输出到 output/ 目录')
    }
}
