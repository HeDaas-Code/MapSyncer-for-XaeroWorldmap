name: Build Forge 1.20.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build Forge mod
        run: ./gradlew :mc-1.20.1:forge:build --no-daemon --stacktrace
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mapsyncer-forge-1.20.1
          path: mc-1.20.1/forge/build/libs/*.jar
